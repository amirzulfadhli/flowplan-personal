name: Verify FlowPlan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: npm ci
      - run: npm run build
      - run: npm run build:desktop
      - run: |
          . ./scripts/windows-env.ps1
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: npx playwright install chromium
      - run: |
          . ./scripts/windows-env.ps1
          npm run desktop:build:test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:companion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ai
      - run: |
          . ./scripts/windows-env.ps1
          npm run desktop:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-beta-diagnostics.mjs "src-tauri/target/release/bundle/nsis/FlowPlan Personal_0.5.0-beta.1_x64-setup.exe"
      # Supervised beta preparation: validate packaging without uploading installers.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-verification
          path: |
            desktop-test-results/
            !desktop-test-results/**/*.exe
            !desktop-test-results/**/*.msi
          retention-days: 7
