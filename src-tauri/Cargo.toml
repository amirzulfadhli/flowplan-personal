[package]
name = "flowplan-personal"
version = "0.4.0"
description = "A local-first personal project workspace"
authors = ["amirzulfadhli"]
edition = "2021"
rust-version = "1.99.1"
default-run = "flowplan-personal"

[lib]
name = "flowplan_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
# Enables an isolated automation profile and WebView2 debug port; never used for packaging.
desktop-test = ["tauri/devtools"]
